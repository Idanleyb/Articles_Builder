# Save this file as .github/workflows/daily_run.yml in your repo.
#
# Setup steps:
# 1. Create a GitHub repo, add these files: fetch_and_score.py, dashboard.html,
#    requirements.txt, and this workflow under .github/workflows/.
# 2. In repo Settings → Secrets and variables → Actions, add:
#      ANTHROPIC_API_KEY   (required)
#      PRODUCT_HUNT_TOKEN  (optional)
# 3. Enable GitHub Pages (Settings → Pages → deploy from branch) so
#    dashboard.html is viewable at a public URL.
# 4. The workflow below runs daily at 06:00 UTC, regenerates data.json,
#    and commits it back to the repo. dashboard.html can then be updated
#    to `fetch('data.json')` instead of using embedded data, so Pages
#    always reflects the latest run.

name: Daily Signal Tracker Run

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily — adjust to your timezone preference
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python fetch_and_score.py

      - name: Commit updated data.json
        run: |
          git config user.name "signal-tracker-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Daily tracker run: $(date -u +%Y-%m-%d)"
          git push
