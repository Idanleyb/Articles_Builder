name: Monday/Wednesday Article Writer

on:
  schedule:
    - cron: "17 7 * * 1"   # Monday 07:17 UTC — offset from :00 to avoid GitHub's peak-congestion minute
    - cron: "17 7 * * 3"   # Wednesday 07:17 UTC
  workflow_dispatch: {}

jobs:
  write-articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run article writer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: python write_articles.py

      - name: Commit updated logs
        run: |
          git config user.name "signal-tracker-bot"
          git config user.email "actions@github.com"
          git add written_log.json selected_for_writing.json
          git diff --staged --quiet || git commit -m "Article writer run: $(date -u +%Y-%m-%d)"
          git push
