name: LinkedIn Post Writer (Tue/Thu)

on:
  schedule:
    - cron: "17 7 * * 2"   # Tuesday 07:17 UTC — offset from :00 to avoid GitHub's peak-congestion minute
    - cron: "17 7 * * 4"   # Thursday 07:17 UTC
  workflow_dispatch: {}

jobs:
  write-linkedin-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate and email post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python write_linkedin_posts.py

      - name: Commit updated log
        run: |
          git config user.name "signal-tracker-bot"
          git config user.email "actions@github.com"
          git add linkedin_post_log.json
          git diff --staged --quiet || git commit -m "LinkedIn post run: $(date -u +%Y-%m-%d)"
          git push
