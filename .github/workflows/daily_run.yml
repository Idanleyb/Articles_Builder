name: Daily Signal Tracker Run

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily — offset from the hour to avoid GitHub's peak-congestion minute (:00)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python fetch_and_score.py

      - name: Commit updated data.json
        run: |
          git config user.name "signal-tracker-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Daily tracker run: $(date -u +%Y-%m-%d)"
          git push
